name: Build and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # runner 上一旦有测试卡住，默认要耗到 6 小时才结束，白烧额度
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.2

      # 测试不拦发布：这套用例要建真窗口量控件坐标、还会直接打 shell 的 COM 接口，
      # 在 runner 上属于环境相关，卡住或失败也不该让 exe 发不出去。真正的门禁是本地
      # `.venv/Scripts/python.exe -m unittest discover -s test`。
      - name: Run tests
        continue-on-error: true
        timeout-minutes: 8
        run: python -m unittest discover -s test -p "test_*.py" -v

      - name: Read APP_VERSION
        id: ver
        shell: bash
        run: |
          version=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' CialloHEVC.py)
          if [ -z "$version" ]; then
            echo "::error::无法从 CialloHEVC.py 解析 APP_VERSION"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "解析到版本 $version"

      - name: Build exe
        run: >
          python -m PyInstaller --clean --noconsole --onefile
          --icon=icon.ico --add-data "icon.ico;."
          CialloHEVC.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CialloHEVC-${{ steps.ver.outputs.version }}
          path: dist/CialloHEVC.exe
          if-no-files-found: error

      # 版本号未变时跳过，避免重复发布；APP_VERSION 每次改源码时递增，因此等同于自动发布
      - name: Publish release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.ver.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::warning::Release $tag 已存在，本次未发布。改动源码请递增 APP_VERSION。"
            exit 0
          fi
          gh release create "$tag" dist/CialloHEVC.exe \
            --title "CialloHEVC $tag" \
            --notes "自动构建于 \`${GITHUB_SHA:0:7}\`。

          下载 \`CialloHEVC.exe\` 即可运行，首次使用需在界面内下载或指定 FFmpeg。"
